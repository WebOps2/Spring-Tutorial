spring.application.name=jpa-practice

# In-memory H2: the database is rebuilt and re-seeded on every run, which suits practice.
spring.datasource.url=jdbc:h2:mem:library;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop

# Watch the SQL Hibernate generates. This is the most useful learning tool here.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=trace
